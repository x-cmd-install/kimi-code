i-code/pull/4804) [`c50a55b`](https://github.com/MoonshotAI/kimi-code/commit/c50a55bf44ddb6855ec49013e7810e0072376a15) Thanks [@liruifengv](https://github.com/liruifengv)! - Fix stdio MCP servers configured with script commands such as npx failing to start on Windows.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
