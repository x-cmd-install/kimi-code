 `AgentSwarm` by itself, so swarms are no longer available in `kimi -p` or ACP clients such as Zed.","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
